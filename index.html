<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas Ahli Kunci</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1c1a15;--mut:#76706200;--mut:#767062;--ac:#c58a1b;--acx:#1c1a15;--bd:#e6e1d5;--soft:#f0ece1;--in:#1f8a56;--out:#c93c32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12100c;--card:#1d1a14;--tx:#f3efe4;--mut:#a59f90;--ac:#e5ae48;--bd:#322d20;--soft:#27231a;--in:#58d18f;--out:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12100c;--card:#1d1a14;--tx:#f3efe4;--mut:#a59f90;--ac:#e5ae48;--bd:#322d20;--soft:#27231a;--in:#58d18f;--out:#ff8a80;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
header small{color:var(--mut);font-size:13px}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:13px;margin:0 0 10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#2a2216,#5a4519);color:#fff7e3;border:0}
.hero small{opacity:.75}.hero .big{font-size:32px;font-weight:800;margin:2px 0 10px;letter-spacing:-.5px}
.hero .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px}
.hero .cols b{display:block;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.chip.new{border-style:dashed;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;color:var(--mut);padding:11px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on.in{background:var(--in);color:#fff}.seg button.on.out{background:var(--out);color:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.amt{font-size:28px;font-weight:800;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:8px;margin-top:8px}.quick button{flex:1}
.cta{width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;font:inherit;font-weight:800;font-size:16px;color:#fff;cursor:pointer}
.cta.in{background:var(--in)}.cta.out{background:var(--out)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div.c{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bars .pair{display:flex;align-items:flex-end;gap:3px;height:92px;width:100%;justify-content:center}
.bars i{display:block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.bars span{font-size:11px;color:var(--mut);margin-top:4px}
.leg{font-size:12px;color:var(--mut);margin-top:8px}
.br{margin:9px 0}.br .t{display:flex;justify-content:space-between;font-size:14px}
.br .b{height:7px;border-radius:4px;background:var(--soft);margin-top:4px;overflow:hidden}.br .b i{display:block;height:100%;border-radius:4px}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:14px 2px 6px;font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:6px;cursor:pointer}
.item .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:15px}.item .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:800;font-size:15px;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);font-size:20px;padding:4px 8px;cursor:pointer}
.in{color:var(--in)}.out{color:var(--out)}.cta.in,.cta.out{color:#fff}
.ic.in{background:color-mix(in srgb,var(--in) 16%,transparent)}.ic.out{background:color-mix(in srgb,var(--out) 16%,transparent)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;text-align:center}
.sum3 div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 4px;font-size:12px;color:var(--mut)}.sum3 b{display:block;font-size:14px;color:var(--tx)}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.prog{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 4px}.prog i{display:block;height:100%;background:var(--ac);border-radius:6px}
.inl{display:flex;gap:8px;margin-top:10px}.inl button,.btn{padding:0 16px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:700;cursor:pointer}
.btn{padding:12px 16px;width:100%;margin-top:10px}.btn.g{background:var(--soft);color:var(--tx)}.btn.d{background:var(--out);color:#fff}
textarea{width:100%;margin-top:10px;min-height:120px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,monospace}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-size:11px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:21px}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#2a2619;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;gap:14px;align-items:center;box-shadow:0 6px 20px #0005;white-space:nowrap}
#toast button{background:none;border:0;color:#f0b84a;font:inherit;font-weight:700;cursor:pointer}
.v{display:none}.v.on{display:block}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.acts .cta{margin-top:0;padding:14px 8px;font-size:15px}
.sub{color:var(--mut);font-size:14px;margin:-6px 0 12px}
</style>
</head>
<body>
<main>
<header><small id="hdr"></small><h1>🔑 Kas Ahli Kunci</h1><p class="sub">Catat pemasukan dan pengeluaran usaha kunci Anda, untung bersih dihitung otomatis.</p></header>

<section class="v on" id="v-home">
  <div class="chips" id="per" style="margin-bottom:12px"></div>
  <div id="home"></div>
</section>

<section class="v" id="v-catat">
  <div class="seg"><button data-a="mode" data-m="in" id="mIn">＋ Pemasukan</button><button data-a="mode" data-m="out" id="mOut">－ Pengeluaran</button></div>
  <div class="card">
    <label id="nomL" style="margin-top:0">Nominal (Rp)</label>
    <input class="amt" id="amt" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="quick"><button class="chip" data-a="q" data-n="10000">+10rb</button><button class="chip" data-a="q" data-n="50000">+50rb</button><button class="chip" data-a="q" data-n="100000">+100rb</button><button class="chip" data-a="q" data-n="0">Reset</button></div>
    <label id="katL">Jenis layanan</label>
    <div class="chips" id="chips"></div>
    <div class="inl" id="newRow" style="display:none"><input id="newTxt" placeholder="Nama baru"><button data-a="chipadd">Tambah</button></div>
    <div class="row2"><div><label>Tanggal</label><input type="date" id="tgl"></div><div><label>Jam</label><input type="time" id="jam"></div></div>
    <label>Catatan (opsional)</label>
    <input id="cat" placeholder="Pelanggan / lokasi / keterangan">
    <button class="cta in" id="save" data-a="save">Simpan pemasukan</button>
    <button class="btn g" id="cancel" data-a="cancel" style="display:none">Batal edit</button>
  </div>
</section>

<section class="v" id="v-hist">
  <div class="acts"><button class="cta in" data-a="add" data-m="in">＋ Tambah pemasukan</button><button class="cta out" data-a="add" data-m="out">－ Tambah pengeluaran</button></div>
  <div class="mnav"><button data-a="hm" data-d="-1">‹</button><b id="hmL"></b><button data-a="hm" data-d="1">›</button></div>
  <div class="sum3" id="hsum"></div>
  <div class="chips" id="hf" style="margin-bottom:10px"></div>
  <input id="q" placeholder="Cari layanan atau catatan…" style="margin-bottom:6px">
  <div id="hl"></div>
</section>

<section class="v" id="v-atur">
  <div class="card"><h2>Target untung bulanan</h2><div class="inl" style="margin-top:0"><input id="tgt" inputmode="numeric" placeholder="Rp 0"><button data-a="tgt">Simpan</button></div></div>
  <div class="card"><h2>Jenis layanan</h2><div class="chips" id="aj"></div><div class="inl"><input id="nj" placeholder="Tambah jenis layanan"><button data-a="addj">Tambah</button></div></div>
  <div class="card"><h2>Kategori pengeluaran</h2><div class="chips" id="ak"></div><div class="inl"><input id="nk" placeholder="Tambah kategori"><button data-a="addk">Tambah</button></div></div>
  <div class="card"><h2>Laporan bulan ini</h2><button class="btn g" style="margin-top:0" data-a="copy">Buat &amp; salin laporan</button><textarea id="rep" readonly style="display:none"></textarea>
  <button class="btn d" id="wipe" data-a="wipe">Hapus semua data</button></div>
</section>
</main>

<div id="toast"><span id="tmsg"></span><button id="tund" data-a="undo" style="display:none">Urungkan</button></div>
<nav><div>
  <button data-a="nav" data-v="home" class="on"><span>🏠</span>Beranda</button>
  <button data-a="nav" data-v="catat"><span>➕</span>Catat</button>
  <button data-a="nav" data-v="hist"><span>🧾</span>Riwayat</button>
  <button data-a="nav" data-v="atur"><span>⚙️</span>Atur</button>
</div></nav>

<script>
(function(){
var KEY="kunci_pro_v2",OLD="pendapatan_ahli_kunci";
var S={tx:[],jenis:["Buka pintu rumah","Buka kunci mobil","Buka kunci motor","Duplikat kunci","Kunci kontak / remote","Pasang / ganti kunci","Brankas"],kat:["Material","Bensin / transport","Alat kerja","Pulsa / internet","Lainnya"],target:0};
try{
  var r=localStorage.getItem(KEY);
  if(r){var o=JSON.parse(r);if(o&&o.tx)S=Object.assign(S,o);}
  else{var ol=localStorage.getItem(OLD);
    if(ol){JSON.parse(ol).forEach(function(j){
      S.tx.push({id:j.id,type:"in",tgl:j.tgl,jam:"",kat:j.jenis,amt:j.upah,cat:j.cat||""});
      if(j.biaya>0){S.tx.push({id:j.id+1,type:"out",tgl:j.tgl,jam:"",kat:"Biaya pekerjaan",amt:j.biaya,cat:j.jenis});if(S.kat.indexOf("Biaya pekerjaan")<0)S.kat.unshift("Biaya pekerjaan");}
    });}
  }
}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(i){return document.getElementById(i);}
function rp(n){return (n<0?"-":"")+"Rp "+new Intl.NumberFormat("id-ID").format(Math.abs(Math.round(n)));}
function pad(n){return n<10?"0"+n:""+n;}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function nowT(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var HR=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
var view="home",per="bulan",mode="in",sel={in:"",out:""},editId=null,hm=ds(new Date()).slice(0,7),hf="all",last=null,tt=null;

function sum(a,t){return a.reduce(function(s,x){return x.type===t?s+x.amt:s;},0);}
function inP(x,p){
  var n=new Date(),today=ds(n),m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));
  if(p==="hari")return x.tgl===today;
  if(p==="minggu")return x.tgl>=ds(m)&&x.tgl<=today;
  if(p==="bulan")return x.tgl.slice(0,7)===today.slice(0,7);
  return true;
}
function group(a,t){
  var g={};a.forEach(function(x){if(x.type===t)g[x.kat]=(g[x.kat]||0)+x.amt;});
  return Object.keys(g).map(function(k){return [k,g[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
}
function bars(g,col){
  if(!g.length)return '<div class="empty">Belum ada data pada periode ini. Catat transaksi lewat tombol Tambah di atas.</div>';
  var mx=g[0][1];
  return g.map(function(e){return '<div class="br"><div class="t"><span>'+esc(e[0])+'</span><b>'+rp(e[1])+'</b></div><div class="b"><i style="width:'+Math.max(4,e[1]/mx*100)+'%;background:'+col+'"></i></div></div>';}).join("");
}

var ACTS='<div class="acts"><button class="cta in" data-a="add" data-m="in">＋ Tambah pemasukan</button><button class="cta out" data-a="add" data-m="out">－ Tambah pengeluaran</button></div>';
function renderHome(){
  var P=[["hari","Hari ini"],["minggu","Minggu ini"],["bulan","Bulan ini"],["all","Semua"]];
  $("per").innerHTML=P.map(function(p){return '<button class="chip'+(per===p[0]?" on":"")+'" data-a="per" data-p="'+p[0]+'">'+p[1]+'</button>';}).join("");
  var a=S.tx.filter(function(x){return inP(x,per);});
  var inc=sum(a,"in"),out=sum(a,"out"),cnt=a.filter(function(x){return x.type==="in";}).length;
  var h=ACTS+'<div class="card hero"><small>Untung bersih</small><div class="big">'+rp(inc-out)+'</div><div class="cols"><div><small>Pemasukan</small><b>'+rp(inc)+'</b></div><div><small>Pengeluaran</small><b>'+rp(out)+'</b></div><div><small>Rata-rata/job</small><b>'+rp(cnt?inc/cnt:0)+'</b></div></div></div>';
  if(!S.tx.length)h+='<div class="card"><h2>Mulai di sini</h2><div>Belum ada catatan. Tekan <b>Tambah pemasukan</b> setiap selesai mengerjakan pekerjaan, dan <b>Tambah pengeluaran</b> untuk biaya seperti material atau bensin. Grafik dan laporan akan muncul otomatis.</div></div>';
  if(S.target>0){
    var mn=S.tx.filter(function(x){return inP(x,"bulan");}),net=sum(mn,"in")-sum(mn,"out"),pc=Math.max(0,Math.min(100,net/S.target*100));
    h+='<div class="card"><h2>Target bulan ini</h2><b>'+rp(net)+'</b> <span style="color:var(--mut)">dari '+rp(S.target)+'</span><div class="prog"><i style="width:'+pc+'%"></i></div><small style="color:var(--mut)">'+Math.round(pc)+'% tercapai'+(net<S.target?" · sisa "+rp(S.target-net):" 🎉")+'</small></div>';
  }
  var days=[],n=new Date(),mx=1;
  for(var i=6;i>=0;i--){var d=new Date(n);d.setDate(n.getDate()-i);var k=ds(d),di=0,do_=0;
    S.tx.forEach(function(x){if(x.tgl===k){if(x.type==="in")di+=x.amt;else do_+=x.amt;}});
    days.push({l:HR[d.getDay()],i:di,o:do_});mx=Math.max(mx,di,do_);}
  h+='<div class="card"><h2>7 hari terakhir</h2><div class="bars">'+days.map(function(d){return '<div class="c"><div class="pair"><i style="height:'+d.i/mx*100+'%;background:var(--in)"></i><i style="height:'+d.o/mx*100+'%;background:var(--out)"></i></div><span>'+d.l+'</span></div>';}).join("")+'</div><div class="leg"><span class="in">■</span> masuk &nbsp; <span class="out">■</span> keluar</div></div>';
  h+='<div class="card"><h2>Pemasukan per layanan</h2>'+bars(group(a,"in"),"var(--in)")+'</div>';
  h+='<div class="card"><h2>Pengeluaran per kategori</h2>'+bars(group(a,"out"),"var(--out)")+'</div>';
  var hc={};a.forEach(function(x){if(x.type==="in"&&x.jam){var H=x.jam.slice(0,2);hc[H]=(hc[H]||0)+1;}});
  var hk=Object.keys(hc).sort(function(x,y){return hc[y]-hc[x];})[0];
  if(hk)h+='<div class="card"><h2>Jam paling ramai</h2><b>'+hk+':00 – '+pad((+hk+1)%24)+':00</b> <span style="color:var(--mut)">· '+hc[hk]+' pekerjaan</span></div>';
  $("home").innerHTML=h;
}

function renderChips(){
  var arr=mode==="in"?S.jenis:S.kat;
  if(!sel[mode]||arr.indexOf(sel[mode])<0)sel[mode]=arr[0]||"";
  $("chips").innerHTML=arr.map(function(k,i){return '<button class="chip'+(sel[mode]===k?" on":"")+'" data-a="chip" data-i="'+i+'">'+esc(k)+'</button>';}).join("")+'<button class="chip new" data-a="chipnew">＋ Baru</button>';
}
function setMode(m){
  mode=m;
  $("mIn").className=m==="in"?"on in":"";$("mOut").className=m==="out"?"on out":"";
  $("katL").textContent=m==="in"?"Jenis layanan":"Kategori pengeluaran";
  var s=$("save");s.className="cta "+m;s.textContent=(editId?"Perbarui ":"Simpan ")+(m==="in"?"pemasukan":"pengeluaran");
  $("newRow").style.display="none";renderChips();
}
function resetForm(){editId=null;$("amt").value="";$("cat").value="";$("tgl").value=ds(new Date());$("jam").value=nowT();$("cancel").style.display="none";setMode(mode);}

function renderHist(){
  var y=+hm.slice(0,4),m=+hm.slice(5,7);
  $("hmL").textContent=BLN[m-1]+" "+y;
  var all=S.tx.filter(function(x){return x.tgl.slice(0,7)===hm;});
  var a=sum(all,"in"),b=sum(all,"out");
  $("hsum").innerHTML='<div>Masuk<b class="in">'+rp(a)+'</b></div><div>Keluar<b class="out">'+rp(b)+'</b></div><div>Bersih<b>'+rp(a-b)+'</b></div>';
  $("hf").innerHTML=[["all","Semua"],["in","Masuk"],["out","Keluar"]].map(function(f){return '<button class="chip'+(hf===f[0]?" on":"")+'" data-a="hfl" data-f="'+f[0]+'">'+f[1]+'</button>';}).join("");
  var q=$("q").value.trim().toLowerCase();
  var l=all.filter(function(x){return (hf==="all"||x.type===hf)&&(!q||(x.kat+" "+x.cat).toLowerCase().indexOf(q)>=0);});
  l.sort(function(x,y2){var A=x.tgl+(x.jam||"00:00"),B=y2.tgl+(y2.jam||"00:00");return A<B?1:A>B?-1:y2.id-x.id;});
  if(!l.length){$("hl").innerHTML='<div class="empty">Belum ada transaksi yang cocok di bulan ini. Gunakan tombol Tambah di atas untuk mencatat pemasukan atau pengeluaran.</div>';return;}
  var out="",cur="";
  l.forEach(function(x){
    if(x.tgl!==cur){cur=x.tgl;var dn=l.filter(function(z){return z.tgl===cur;}).reduce(function(s,z){return s+(z.type==="in"?z.amt:-z.amt);},0);var d=new Date(cur+"T00:00:00");
      out+='<div class="day"><span>'+HR[d.getDay()]+", "+d.getDate()+" "+BLN[d.getMonth()].slice(0,3)+'</span><span>'+rp(dn)+'</span></div>';}
    out+='<div class="item" data-a="edit" data-id="'+x.id+'"><div class="ic '+x.type+'">'+(x.type==="in"?"↓":"↑")+'</div><div class="m"><b>'+esc(x.kat)+'</b><small>'+(x.jam?x.jam+" · ":"")+(esc(x.cat)||(x.type==="in"?"Pemasukan":"Pengeluaran"))+'</small></div><div class="val '+x.type+'">'+(x.type==="in"?"+":"−")+rp(x.amt).replace("Rp ","")+'</div><button class="x" data-a="del" data-id="'+x.id+'" aria-label="Hapus">×</button></div>';
  });
  $("hl").innerHTML=out;
}

function renderAtur(){
  $("tgt").value=S.target?new Intl.NumberFormat("id-ID").format(S.target):"";
  function c(arr,t){return arr.map(function(k,i){return '<span class="chip">'+esc(k)+' <button class="x" style="padding:0 0 0 6px;font-size:16px" data-a="'+t+'" data-i="'+i+'" aria-label="Hapus">×</button></span>';}).join("");}
  $("aj").innerHTML=c(S.jenis,"rmj");$("ak").innerHTML=c(S.kat,"rmk");
}

function go(v){
  view=v;
  ["home","catat","hist","atur"].forEach(function(x){$("v-"+x).className="v"+(x===v?" on":"");});
  var bs=document.querySelectorAll("nav button");for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute("data-v")===v?"on":"";
  if(v==="home")renderHome();if(v==="hist")renderHist();if(v==="atur")renderAtur();
  if(v==="catat"&&!editId){$("tgl").value=$("tgl").value||ds(new Date());}
  window.scrollTo(0,0);
}
function toast(msg,undo){
  $("tmsg").textContent=msg;$("tund").style.display=undo?"inline":"none";$("toast").style.display="flex";
  clearTimeout(tt);tt=setTimeout(function(){$("toast").style.display="none";},undo?5000:1800);
}
function digits(s){return parseInt(String(s).replace(/\D/g,""),10)||0;}
function fmtIn(el){var n=digits(el.value);el.value=n?new Intl.NumberFormat("id-ID").format(n):"";}
function addTo(arr,val){val=val.trim();if(val&&arr.indexOf(val)<0)arr.push(val);return val;}

$("amt").addEventListener("input",function(){fmtIn(this);});
$("tgt").addEventListener("input",function(){fmtIn(this);});
$("q").addEventListener("input",renderHist);

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=t.getAttribute("data-a"),i=t.getAttribute("data-i"),id=t.getAttribute("data-id");
  if(a==="nav")go(t.getAttribute("data-v"));
  else if(a==="add"){editId=null;mode=t.getAttribute("data-m");go("catat");resetForm();}
  else if(a==="per"){per=t.getAttribute("data-p");renderHome();}
  else if(a==="mode"){setMode(t.getAttribute("data-m"));}
  else if(a==="q"){var n=+t.getAttribute("data-n");$("amt").value=n?new Intl.NumberFormat("id-ID").format(digits($("amt").value)+n):"";}
  else if(a==="chip"){sel[mode]=(mode==="in"?S.jenis:S.kat)[+i];renderChips();}
  else if(a==="chipnew"){$("newRow").style.display="flex";$("newTxt").focus();}
  else if(a==="chipadd"){var v=addTo(mode==="in"?S.jenis:S.kat,$("newTxt").value);if(v){sel[mode]=v;persist();$("newTxt").value="";$("newRow").style.display="none";renderChips();}}
  else if(a==="save"){
    var am=digits($("amt").value);if(am<=0){$("amt").focus();toast("Isi nominal dulu");return;}
    var tx={id:editId||Date.now(),type:mode,tgl:$("tgl").value||ds(new Date()),jam:$("jam").value||"",kat:sel[mode]||"Lainnya",amt:am,cat:$("cat").value.trim()};
    if(editId){S.tx=S.tx.map(function(x){return x.id===editId?tx:x;});}else S.tx.push(tx);
    var was=editId;persist();resetForm();toast("Tersimpan ✓");if(was)go("hist");
  }
  else if(a==="cancel"){resetForm();go("hist");}
  else if(a==="edit"){
    var x=S.tx.filter(function(z){return String(z.id)===id;})[0];if(!x)return;
    editId=x.id;mode=x.type;sel[mode]=x.kat;
    var arr=mode==="in"?S.jenis:S.kat;if(arr.indexOf(x.kat)<0)arr.push(x.kat);
    go("catat");setMode(mode);
    $("amt").value=new Intl.NumberFormat("id-ID").format(x.amt);$("tgl").value=x.tgl;$("jam").value=x.jam||"";$("cat").value=x.cat||"";
    $("cancel").style.display="block";setMode(mode);
  }
  else if(a==="del"){
    e.stopPropagation();
    last=S.tx.filter(function(z){return String(z.id)===id;})[0];
    S.tx=S.tx.filter(function(z){return String(z.id)!==id;});persist();renderHist();toast("Dihapus",true);
  }
  else if(a==="undo"){if(last){S.tx.push(last);last=null;persist();renderHist();$("toast").style.display="none";}}
  else if(a==="hm"){var y=+hm.slice(0,4),m=+hm.slice(5,7)+ +t.getAttribute("data-d");if(m<1){m=12;y--;}if(m>12){m=1;y++;}hm=y+"-"+pad(m);renderHist();}
  else if(a==="hfl"){hf=t.getAttribute("data-f");renderHist();}
  else if(a==="tgt"){S.target=digits($("tgt").value);persist();toast("Target disimpan ✓");}
  else if(a==="addj"){if(addTo(S.jenis,$("nj").value)){persist();renderAtur();}}
  else if(a==="addk"){if(addTo(S.kat,$("nk").value)){persist();renderAtur();}}
  else if(a==="rmj"){if(S.jenis.length>1){S.jenis.splice(+i,1);persist();renderAtur();}}
  else if(a==="rmk"){if(S.kat.length>1){S.kat.splice(+i,1);persist();renderAtur();}}
  else if(a==="copy"){
    var mn=S.tx.filter(function(x){return inP(x,"bulan");}),n=new Date(),inc=sum(mn,"in"),out=sum(mn,"out");
    var txt="LAPORAN "+BLN[n.getMonth()].toUpperCase()+" "+n.getFullYear()+"\nPemasukan : "+rp(inc)+"\nPengeluaran: "+rp(out)+"\nUntung bersih: "+rp(inc-out)+"\nJumlah job: "+mn.filter(function(x){return x.type==="in";}).length+"\n\nPer layanan:\n"+group(mn,"in").map(function(g){return "- "+g[0]+": "+rp(g[1]);}).join("\n")+"\n\nPengeluaran:\n"+group(mn,"out").map(function(g){return "- "+g[0]+": "+rp(g[1]);}).join("\n");
    var ta=$("rep");ta.style.display="block";ta.value=txt;ta.select();
    try{navigator.clipboard.writeText(txt).then(function(){toast("Laporan disalin ✓");},function(){toast("Salin manual dari kotak");});}catch(er){toast("Salin manual dari kotak");}
  }
  else if(a==="wipe"){
    if(t.getAttribute("data-s")!=="1"){t.setAttribute("data-s","1");t.textContent="Tekan lagi untuk konfirmasi";setTimeout(function(){t.removeAttribute("data-s");t.textContent="Hapus semua data";},3500);}
    else{S.tx=[];persist();t.removeAttribute("data-s");t.textContent="Hapus semua data";toast("Semua data dihapus");}
  }
});

var d0=new Date();$("hdr").textContent=HR[d0.getDay()]+", "+d0.getDate()+" "+BLN[d0.getMonth()]+" "+d0.getFullYear();
resetForm();renderHome();
})();
</script>
</body>
</html>
